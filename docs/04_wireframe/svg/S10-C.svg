<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>S10-C — Chiarimento della città</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#383838"/><text x="20" y="26" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#565656"><tspan x="20" dy="0">S10-C · WIREFRAME</tspan></text><text x="20" y="60" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202020"><tspan x="20" dy="0">Chiarimento della città</tspan></text><rect x="314" y="37" width="56" height="44" rx="7" fill="#fff" stroke="#555"/><text x="323" y="63" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#202020"><tspan x="323" dy="0">AI</tspan></text><line x1="20" y1="96" x2="370" y2="96" stroke="#4b4b4b" stroke-width="1.7"/><g id="C18-S10-C-110" data-component="C18"><g id="" aria-label="Tu · [Richiesta geografica vaga]"><rect x="20" y="110" width="350" height="91" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">Tu · [Richiesta geografica vaga]</tspan></text><text x="32" y="160.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">La città richiesta non è distinguibile.</tspan></text></g></g><g id="C18-S10-C-211" data-component="C18"><g id="" aria-label="AI · In quale città italiana?"><rect x="20" y="211" width="350" height="119" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">AI · In quale città italiana?</tspan></text><text x="32" y="261.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">Copertura iniziale: Italia. Il contesto non</tspan><tspan x="32" dy="16.799999999999997">basta; scegli la città senza GPS.</tspan></text></g></g><g id="C01-S10-C-340" data-component="C01"><g id="" aria-label="Città richiesta"><rect x="20" y="340" width="350" height="88" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">Città richiesta</tspan></text><text x="32" y="390.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">Scelta manuale; GPS non necessario</tspan></text></g></g><g id="C18-S10-C-438" data-component="C18"><g id="C18-action" aria-label="Conferma città e continua"><rect x="20" y="438" width="350" height="44" rx="7" fill="#303030" stroke="#303030"/><text x="32" y="465" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#fff"><tspan x="32" dy="0">Conferma città e continua</tspan></text></g></g><g id="C39-S10-C-492" data-component="C39"><g id="C39-action" aria-label="Torna alla ricerca ordinaria"><rect x="20" y="492" width="350" height="44" rx="7" fill="#fff" stroke="#303030"/><text x="32" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#202020"><tspan x="32" dy="0">Torna alla ricerca ordinaria</tspan></text></g></g><rect x="0" y="766" width="390" height="78" rx="0" fill="#f5f5f5" stroke="#aaa"/><rect x="16" y="777" width="84" height="49" rx="6" fill="#ddd" stroke="#aaa"/><text x="25" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020"><tspan x="25" dy="0">Esplora</tspan></text><rect x="110" y="777" width="84" height="49" rx="6" fill="#fff" stroke="#aaa"/><text x="119" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#202020"><tspan x="119" dy="0">Salvati</tspan></text><rect x="204" y="777" width="84" height="49" rx="6" fill="#fff" stroke="#aaa"/><text x="213" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#202020"><tspan x="213" dy="0">Chat</tspan></text><rect x="298" y="777" width="84" height="49" rx="6" fill="#fff" stroke="#aaa"/><text x="307" y="807" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#202020"><tspan x="307" dy="0">Profilo</tspan></text></svg>
