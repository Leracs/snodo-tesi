<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>S18-R — Invio fallito</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="390" height="844" rx="0" fill="#fff" stroke="#383838"/><text x="20" y="26" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#565656"><tspan x="20" dy="0">S18-R · WIREFRAME</tspan></text><text x="20" y="60" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202020"><tspan x="20" dy="0">Invio fallito</tspan></text><rect x="314" y="37" width="56" height="44" rx="7" fill="#fff" stroke="#555"/><text x="323" y="63" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#202020"><tspan x="323" dy="0">AI</tspan></text><line x1="20" y1="96" x2="370" y2="96" stroke="#4b4b4b" stroke-width="1.7"/><g id="C34-S18-R-110" data-component="C34"><g id="" aria-label="Invio non riuscito"><rect x="20" y="110" width="350" height="103" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="133" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">Invio non riuscito</tspan></text><text x="32" y="160.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">Nessuna conferma di pubblicazione.</tspan></text></g></g><g id="C31-S18-R-223" data-component="C31"><g id="" aria-label="La bozza è conservata"><rect x="20" y="223" width="350" height="97" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">La bozza è conservata</tspan></text><text x="32" y="273.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">Testo, risposte, destinatari e identità.</tspan></text></g></g><g id="C34-S18-R-330" data-component="C34"><g id="" aria-label="Controlla lo stato del contributo"><rect x="20" y="330" width="350" height="98" rx="8" fill="#f5f5f5" stroke="#9a9a9a"/><text x="32" y="353" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#202020"><tspan x="32" dy="0">Controlla lo stato del contributo</tspan></text><text x="32" y="380.25" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="32" dy="0">Se già ricevuto, viene mostrato l’esito.</tspan></text></g></g><g id="C34-S18-R-438" data-component="C34"><g id="C34-action" aria-label="Riprova l’invio"><rect x="20" y="438" width="350" height="44" rx="7" fill="#303030" stroke="#303030"/><text x="32" y="465" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#fff"><tspan x="32" dy="0">Riprova l’invio</tspan></text></g></g><g id="C31-S18-R-492" data-component="C31"><g id="C31-action" aria-label="Salva bozza ed esci"><rect x="20" y="492" width="350" height="44" rx="7" fill="#fff" stroke="#303030"/><text x="32" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#202020"><tspan x="32" dy="0">Salva bozza ed esci</tspan></text></g></g><g id="C33-S18-R-546" data-component="C33"><g id="C33-action" aria-label="Torna all’anteprima"><rect x="20" y="546" width="350" height="44" rx="7" fill="#fff" stroke="#303030"/><text x="32" y="573" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#202020"><tspan x="32" dy="0">Torna all’anteprima</tspan></text></g></g><rect x="20" y="786" width="350" height="42" rx="6" fill="#fff" stroke="#aaa"/><text x="32" y="812" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020"><tspan x="32" dy="0">Indietro · contesto conservato</tspan></text></svg>
