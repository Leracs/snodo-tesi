f"><tspan x="32" dy="0">Invia inviti e crea proposta</tspan></text></g></g><rect x="20" y="786" width="350" height="42" rx="6" fill="#fff" stroke="#aaa"/><text x="32" y="812" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#202020"><tspan x="32" dy="0">Indietro · contesto conservato</tspan></text></svg>
