<svg xmlns="http://www.w3.org/2000/svg" width="390" height="380" viewBox="0 0 390 380" role="img" aria-labelledby="title desc"><title id="title">DS10 · Messaggio AI · Calda · Risposta</title><desc id="desc">Componente SNODO, visuale statica con dati dimostrativi. Forme, icone e testi vettoriali. Layout HTML a 390 px.</desc><defs></defs><g opacity="1"><g opacity="1"><rect x="0" y="0" width="390" height="379.59" rx="12" fill="rgb(255, 252, 247)"/><rect x="0.5" y="0.5" width="389" height="378.59" rx="11.5" fill="none" stroke="rgb(215, 201, 185)" stroke-width="1"/><g opacity="1"><rect x="21" y="41" width="348" height="297.59" rx="20" fill="rgb(255, 252, 247)"/><rect x="21.5" y="41.5" width="347" height="296.59" rx="19.5" fill="none" stroke="rgb(138, 119, 105)" stroke-width="1"/><g opacity="1"><text x="42" y="76.8" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="14" font-weight="700" font-style="normal" letter-spacing="0" fill="rgb(40, 34, 31)" xml:space="preserve">Assistente AI</text><g opacity="1"><text x="132.8" y="75.2" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="12" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(100, 84, 74)" xml:space="preserve">Ricerca simulata</text></g></g><g opacity="1"><text x="42" y="101.8" font-family="Georgia, serif" font-size="19" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(40, 34, 31)" xml:space="preserve">I criteri, prima dei consigli.</text></g><g opacity="1"><text x="42" y="134.79" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(40, 34, 31)" xml:space="preserve">Roma · fino a 20 € · rumore necessario</text><text x="42" y="158.79" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(40, 34, 31)" xml:space="preserve">≤2/5</text></g><g opacity="1"><text x="42" y="190.79" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(40, 34, 31)" xml:space="preserve">1 luogo corrisponde nel catalogo mock.</text></g><g opacity="1"><text x="42" y="220.39" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(100, 84, 74)" xml:space="preserve">Fonti e limiti nelle schede. I criteri si applicano</text><text x="42" y="241.39" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(100, 84, 74)" xml:space="preserve">solo con la tua conferma.</text></g><g opacity="1"><g opacity="1"><text x="42" y="296.89" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="14" font-weight="400" font-style="normal" letter-spacing="0" fill="rgb(156, 67, 45)" xml:space="preserve">Correggi</text></g><g opacity="1"><rect x="106.45" y="267.59" width="241.55" height="50" rx="12" fill="rgb(156, 67, 45)"/><rect x="106.95" y="268.09" width="240.55" height="49" rx="11.5" fill="none" stroke="rgb(156, 67, 45)" stroke-width="1"/><text x="181.09" y="297.79" font-family="&quot;Trebuchet MS&quot;, sans-serif" font-size="16" font-weight="700" font-style="normal" letter-spacing="0" fill="rgb(255, 255, 255)" xml:space="preserve">Vedi i luoghi</text></g></g></g></g></g></svg>
