  <main>
    <p><a href="README.html">← Design system SNODO</a></p>
    <h1>Atmosfera e affluenza</h1>
    <p class="demo-note">Pattern DS08 + DS19. Tre fasce configurabili e condizioni separate. Tutti i valori sono esempi predisposti; Forma DJR Text usa il fallback Helvetica Neue.</p>
    <div class="demo-controls">
      <label>Direzione visiva<select id="demo-theme"><option value="B">B · Pop pastello</option><option value="A">A · Calda editoriale</option></select></label>
      <label>Stato del componente<select id="demo-place"><option value="luogo-roma-01">Cortile Uno · Dati limitati</option><option value="luogo-roma-02">Spazio Lume · Fascia assente il lunedì</option><option value="luogo-roma-04">Giardino Piccolo · Dati assenti</option></select></label>
    </div>
    <div id="component"></div>
    <p class="demo-note"><a href="Atmosfera_affluenza.html">Leggi la specifica del pattern</a> · <a href="../07_prototipo/index.html">Apri il prototipo</a></p>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{
      const container=document.getElementById('component');
      const select=document.getElementById('demo-place');
      function render(){const place=window.SNODO_CATALOG.places.find(place=>place.id===select.value);container.innerHTML=window.SnodoAtmosfera.render(place);window.SnodoAtmosfera.mount(container,place);}
      document.getElementById('demo-theme').addEventListener('change',event=>{document.body.dataset.theme=event.target.value;});
      select.addEventListener('change',render);render();
    });
  </script>
</body>
