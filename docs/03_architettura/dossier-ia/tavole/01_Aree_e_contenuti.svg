<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">01 · Aree, contenuti e accessi condivisi</title><desc id="desc">Quattro aree principali. Esplora, Salvati e Chat rimandano alla stessa scheda luogo. AI e contesto attraversano la struttura.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA2A3"/></marker></defs><rect x="420" y="5" width="360" height="55" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="436" y="35" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">SNODO · struttura proposta</text><polyline points="600,60 600,80 140,80 140,100" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,80 440,80 440,100" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,80 740,80 740,100" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,80 1040,80 1040,100" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><rect x="10" y="100" width="280" height="145" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="130" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Esplora</text><text x="26" y="157" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Ricerca e filtri</text><text x="26" y="181" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Mappa / lista</text><text x="26" y="205" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Città, zona, riferimento</text><rect x="310" y="100" width="280" height="145" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="326" y="130" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Salvati</text><text x="326" y="157" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Luoghi salvati</text><text x="326" y="181" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Raccolte facoltative</text><rect x="610" y="100" width="280" height="145" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="626" y="130" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Chat</text><text x="626" y="157" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Proposte di uscita</text><text x="626" y="181" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Partecipanti e alternative</text><text x="626" y="205" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Criteri, messaggi, esito</text><rect x="910" y="100" width="280" height="145" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="926" y="130" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Profilo</text><text x="926" y="157" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Preferenze personali</text><text x="926" y="181" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Recensioni e bozze</text><text x="926" y="205" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Impostazioni da definire</text><polyline points="140,245 140,275 600,275 600,340" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="440,245 440,290 580,290 580,340" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="740,245 740,305 620,305 620,340" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="10" y="325" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Accessi alla stessa scheda · nessuna copia del luogo</text><rect x="390" y="340" width="420" height="70" rx="10" fill="#ECE4F4" stroke="#8AA2A3" stroke-width="1.6"/><text x="406" y="370" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Scheda luogo condivisa · O01 / S05</text><text x="406" y="397" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Stesso identificativo da ogni accesso</text><polyline points="1040,245 1040,290 1198,290 1198,542 1120,542 1120,550" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1030" y="323" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#163F42">Riprendi bozza</text><polyline points="600,410 600,435 140,435 140,450" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,435 440,435 440,450" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,435 740,435 740,450" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><polyline points="600,435 1040,435 1040,450" fill="none" stroke="#8AA2A3" stroke-width="1.6"/><rect x="10" y="450" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="480" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Informazioni pratiche</text><text x="26" y="507" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Orari, servizi, dati utili</text><rect x="310" y="450" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="326" y="480" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Atmosfera / affluenza</text><text x="326" y="507" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Due blocchi distinti</text><rect x="610" y="450" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="626" y="480" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Foto e media</text><text x="626" y="507" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Origine riconoscibile</text><rect x="910" y="450" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="926" y="480" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Recensioni</text><text x="926" y="507" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Visita e testimonianze</text><rect x="10" y="550" width="1180" height="85" rx="10" fill="#F3ECE2" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="26" y="580" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#163F42">CONTESTI E PERCORSI TRASVERSALI</text><text x="26" y="608" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#163F42">AI: ricerca / gruppo / scrittura  ·  Origine del dato  ·  Scrivi una recensione  ·  Apri Maps</text><line x1="10" y1="670" x2="1190" y2="670" stroke="#8AA2A3" stroke-width="1"/><text x="10" y="698" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">Legenda. Linee continue: appartenenza. Linee tratteggiate: accesso a contenuti condivisi; riquadro tratteggiato: percorsi</text><text x="10" y="720" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">trasversali. I colori raggruppano i ruoli e non indicano uno stato di validazione.</text></svg>