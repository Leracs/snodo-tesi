<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">02 · Relazioni tra i contenuti</title><desc id="desc">Mappa concettuale selettiva: luogo e contributi a sinistra; criteri, proposta e partecipazione a destra. Le frecce hanno verbi; le cardinalità complete sono in tabella.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA2A3"/></marker></defs><text x="15" y="24" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#163F42">LUOGO E CONTRIBUTI</text><text x="665" y="24" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#163F42">SCELTA CON AMICI</text><rect x="150" y="48" width="350" height="65" rx="10" fill="#ECE4F4" stroke="#8AA2A3" stroke-width="1.6"/><text x="166" y="78" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Luogo · O01</text><rect x="10" y="205" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="235" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Informazioni / media</text><text x="26" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">O03 / O04</text><text x="26" y="286" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Fonte, data, contesto</text><rect x="330" y="205" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="346" y="235" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Visita dichiarata · O05</text><text x="346" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Data e fascia</text><text x="346" y="286" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Esperienza della persona</text><rect x="330" y="385" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="346" y="415" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Recensione · O06</text><text x="346" y="442" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Testo, identità, visibilità</text><rect x="10" y="385" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="415" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Riepiloghi · O07</text><text x="26" y="442" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Atmosfera e affluenza</text><text x="26" y="466" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Informazioni distinte</text><polyline points="240,113 240,150 145,150 145,205" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="179" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">ha</text><polyline points="440,113 465,113 465,205" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="475" y="170" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">riceve</text><polyline points="465,305 465,385" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="477" y="347" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">sostiene 0..1</text><polyline points="330,428 280,428" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="300" y="365" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#163F42">può contribuire</text><rect x="685" y="48" width="485" height="65" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="701" y="78" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Contesto e criteri · O02 / O08</text><rect x="685" y="205" width="485" height="100" rx="10" fill="#ECE4F4" stroke="#8AA2A3" stroke-width="1.6"/><text x="701" y="235" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Proposta di uscita · O11</text><text x="701" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Alternative = riferimenti a luoghi esistenti</text><text x="701" y="286" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Occasione, data/fascia e stato</text><rect x="685" y="385" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="701" y="415" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Partecipazione · O12</text><text x="701" y="442" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Invito, risposta, conferma</text><rect x="990" y="385" width="180" height="90" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="1006" y="415" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Chat · O10</text><text x="1006" y="442" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Messaggi</text><polyline points="930,113 930,205" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="942" y="163" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">contestualizzano</text><polyline points="685,255 635,255 635,80 500,80" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="625" y="184" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end" fill="#163F42">confronta</text><polyline points="820,305 820,385" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="832" y="348" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">raccoglie</text><polyline points="1080,305 1080,385" fill="none" stroke="#8AA2A3" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1092" y="348" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">ha una</text><rect x="10" y="545" width="570" height="85" rx="10" fill="#F3ECE2" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="575" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Salvataggio · O09</text><text x="26" y="602" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Rimanda al luogo senza duplicarne i dati</text><rect x="620" y="545" width="550" height="85" rx="10" fill="#F3ECE2" stroke="#8AA2A3" stroke-width="1.6"/><text x="636" y="575" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Preferenza personale · O13</text><text x="636" y="602" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Resta privata fino alla condivisione volontaria</text><text x="10" y="515" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Lettura semplificata; tutte le 14 relazioni sono in T04.</text><line x1="10" y1="670" x2="1190" y2="670" stroke="#8AA2A3" stroke-width="1"/><text x="10" y="698" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">Legenda. Frecce: relazione indicata dal verbo, non ordine di azioni. Freccia tratteggiata: riferimento a un luogo condiviso. I due</text><text x="10" y="720" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">riquadri inferiori esplicitano regole di riuso e condivisione; le relazioni complete sono in T04.</text></svg>