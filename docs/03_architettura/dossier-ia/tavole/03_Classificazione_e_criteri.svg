<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">03 · Classificazione e ambiti dei criteri</title><desc id="desc">Tre livelli: attributi del luogo, criteri della richiesta e contesto dei dati. Il livello di vincolo e l’ambito dei criteri restano espliciti.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8AA2A3"/></marker></defs><rect x="10" y="10" width="370" height="95" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">ATTRIBUTI DEL LUOGO</text><text x="26" y="67" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Che cosa descrive il catalogo?</text><rect x="415" y="10" width="370" height="95" rx="10" fill="#ECE4F4" stroke="#8AA2A3" stroke-width="1.6"/><text x="431" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">CRITERI DELLA RICHIESTA</text><text x="431" y="67" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Che cosa cerca la persona?</text><rect x="820" y="10" width="370" height="95" rx="10" fill="#F3ECE2" stroke="#8AA2A3" stroke-width="1.6"/><text x="836" y="40" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">CONTESTO DEL DATO</text><text x="836" y="67" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Come si interpreta l’informazione?</text><rect x="10" y="130" width="370" height="240" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="164" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Categoria / attività</text><text x="26" y="199" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Orari e servizi</text><text x="26" y="234" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Informazioni sul budget</text><text x="26" y="269" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Posizione del luogo</text><text x="26" y="304" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Atmosfera: luce, rumore, comfort</text><text x="26" y="339" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Affluenza: giorno e tre fasce</text><rect x="415" y="130" width="370" height="240" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="431" y="164" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Occasione</text><text x="431" y="199" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Budget richiesto</text><text x="431" y="234" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Area e distanza dal riferimento</text><text x="431" y="269" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Condizioni desiderate</text><text x="431" y="304" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Vincolo oppure preferenza</text><text x="431" y="339" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Criteri espliciti e modificabili</text><rect x="820" y="130" width="370" height="240" rx="10" fill="#FFFFFF" stroke="#8AA2A3" stroke-width="1.6"/><text x="836" y="164" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Origine e aggiornamento</text><text x="836" y="199" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Visita, giorno e fascia</text><text x="836" y="234" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Quantità e recenza dei contributi</text><text x="836" y="269" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Copertura e incertezza</text><text x="836" y="304" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Dato assente / discordante</text><text x="836" y="339" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Chiuso ≠ dato assente</text><polyline points="380,250 415,250" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><polyline points="785,250 820,250" fill="none" stroke="#8AA2A3" stroke-width="1.6" stroke-dasharray="7 5"/><text x="600" y="412" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#163F42">AMBITO DEL CRITERIO</text><rect x="10" y="435" width="370" height="110" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="26" y="465" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Personale</text><text x="26" y="492" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Preferenze gestite in Profilo</text><text x="26" y="516" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Private per impostazione di progetto</text><rect x="415" y="435" width="370" height="110" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="431" y="465" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Ricerca corrente</text><text x="431" y="492" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Città e criteri visibili</text><text x="431" y="516" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Conservati tra mappa, lista e AI</text><rect x="820" y="435" width="370" height="110" rx="10" fill="#DCEEEB" stroke="#8AA2A3" stroke-width="1.6"/><text x="836" y="465" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#163F42">Proposta di gruppo</text><text x="836" y="492" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Contesto condiviso esplicito</text><text x="836" y="516" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">Solo criteri condivisi volontariamente</text><text x="10" y="595" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#163F42">Vocabolari, fasce di budget e servizi: da definire. Non tutti gli attributi sono già filtri.</text><text x="10" y="627" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#163F42">La condivisione richiede una scelta esplicita; l’AI usa l’ambito del compito.</text><line x1="10" y1="670" x2="1190" y2="670" stroke="#8AA2A3" stroke-width="1"/><text x="10" y="698" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">Legenda. Colonne: attributi, criteri della richiesta, contesto del dato. Collegamenti tratteggiati: corrispondenza concettuale,</text><text x="10" y="720" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#53666A">non trasferimento automatico. Riga inferiore: tre ambiti di applicazione; colori accompagnati da etichette.</text></svg>