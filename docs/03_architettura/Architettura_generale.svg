<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img"><title>Architettura generale — quattro aree e oggetti condivisi</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="1600" height="1350" rx="0" fill="#fff" stroke="#fff"/><text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#202020"><tspan x="48" dy="0">Architettura delle informazioni</tspan></text><text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#202020"><tspan x="48" dy="0">Italia · città/zona modificabili senza GPS · distanze da un riferimento dichiarato</tspan></text><text x="48" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="48" dy="0">H: struttura proposta | C: perimetro | wireframe costruiti; interazioni native e test non verificati</tspan></text><g id="" aria-label="Esplora  S01–S08"><rect x="48" y="166" width="358" height="242" rx="8" fill="#ededed" stroke="#9a9a9a"/><text x="60" y="189" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#202020"><tspan x="60" dy="0">Esplora  S01–S08</tspan></text><text x="60" y="227.05" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="60" dy="0">Contesto città/zona</tspan><tspan x="60" dy="22.4">Ricerca • filtri • mappa/lista</tspan><tspan x="60" dy="22.4">Scheda luogo e dettagli</tspan></text></g><line x1="227" y1="408" x2="227" y2="443" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="" aria-label="Salvati  S19"><rect x="430" y="166" width="358" height="242" rx="8" fill="#ededed" stroke="#9a9a9a"/><text x="442" y="189" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#202020"><tspan x="442" dy="0">Salvati  S19</tspan></text><text x="442" y="227.05" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="442" dy="0">Luoghi salvati</tspan><tspan x="442" dy="22.4">Ripresa della stessa scheda</tspan><tspan x="442" dy="22.4">Proposta agli amici</tspan></text></g><line x1="609" y1="408" x2="609" y2="443" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="" aria-label="Chat  S11–S14"><rect x="812" y="166" width="358" height="242" rx="8" fill="#ededed" stroke="#9a9a9a"/><text x="824" y="189" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#202020"><tspan x="824" dy="0">Chat  S11–S14</tspan></text><text x="824" y="227.05" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="824" dy="0">Proposte e inviti</tspan><tspan x="824" dy="22.4">Vincoli • alternative • preferenze</tspan><tspan x="824" dy="22.4">Conferme ed esito umano</tspan></text></g><line x1="991" y1="408" x2="991" y2="443" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="" aria-label="Profilo  S20"><rect x="1194" y="166" width="358" height="242" rx="8" fill="#ededed" stroke="#9a9a9a"/><text x="1206" y="189" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#202020"><tspan x="1206" dy="0">Profilo  S20</tspan></text><text x="1206" y="227.05" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="1206" dy="0">Preferenze personali</tspan><tspan x="1206" dy="22.4">Contributi e visibilità</tspan><tspan x="1206" dy="22.4">Bozze da riprendere</tspan></text></g><line x1="1373" y1="408" x2="1373" y2="443" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="" aria-label="AI trasversale — S10 / S13 / S16"><rect x="48" y="453" width="1504" height="102" rx="8" fill="#f4f4f4" stroke="#9a9a9a"/><text x="60" y="476" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#202020"><tspan x="60" dy="0">AI trasversale — S10 / S13 / S16</tspan></text><text x="60" y="512.7" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="60" dy="0">Ricerca: chiarisce e mostra criteri. Gruppo: propone quando chiamata. Recensione: suggerisce, autore applica e invia.</tspan></text></g><g id="" aria-label="Percorsi condivisi"><rect x="48" y="574" width="1504" height="112" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="60" y="597" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#202020"><tspan x="60" dy="0">Percorsi condivisi</tspan></text><text x="60" y="632.35" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="60" dy="0">S09 Origine del dato • S15–S18 Visita e contributo • S21 Uscita verso Maps con ritorno al contesto</tspan></text></g><text x="48" y="733" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#202020"><tspan x="48" dy="0">Oggetti condivisi (non schermate)</tspan></text><g id="" aria-label="Luogo e testimonianze"><rect x="48" y="767" width="480" height="158" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="60" y="790" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#202020"><tspan x="60" dy="0">Luogo e testimonianze</tspan></text><text x="60" y="824.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="60" dy="0">O01 Luogo → O03 Informazioni / O04 Media</tspan><tspan x="60" dy="22.4">O05 Visita → O06 Recensione → O07 Atmosfera</tspan></text></g><g id="" aria-label="Ricerca e contesto"><rect x="560" y="767" width="480" height="158" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="572" y="790" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#202020"><tspan x="572" dy="0">Ricerca e contesto</tspan></text><text x="572" y="824.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="572" dy="0">O02 Città/zona/riferimento → O08 Criteri</tspan><tspan x="572" dy="22.4">O09 Salvataggio → stesso O01 Luogo</tspan></text></g><g id="" aria-label="Decisione con amici"><rect x="1072" y="767" width="480" height="158" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="1084" y="790" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#202020"><tspan x="1084" dy="0">Decisione con amici</tspan></text><text x="1084" y="824.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="1084" dy="0">O10 Conversazione → O11 Proposta → O12</tspan><tspan x="1084" dy="22.4">Partecipazione</tspan><tspan x="1084" dy="22.4">O13 Preferenza personale: condivisa soltanto</tspan><tspan x="1084" dy="22.4">volontariamente</tspan></text></g><g id="" aria-label="Regole che attraversano ogni area"><rect x="48" y="958" width="1504" height="156" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="60" y="981" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#202020"><tspan x="60" dy="0">Regole che attraversano ogni area</tspan></text><text x="60" y="1015.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="60" dy="0">Un luogo ha un solo ID. Nessun vincolo allentato in silenzio. Invito ≠ adesione ≠ preferenza ≠ conferma.</tspan><tspan x="60" dy="22.4">Il silenzio resta attesa. Dati assenti e fonti discordanti sono stati leggibili.</tspan><tspan x="60" dy="22.4">Catalogo e simulazioni sono mock; non costituiscono dati aggiornati né risultati di ricerca.</tspan></text></g><text x="48" y="1165" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#202020"><tspan x="48" dy="0">Fuori dal nucleo</tspan></text><text x="48" y="1200" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#202020"><tspan x="48" dy="0">Feed, follower, matching, wrapped, badge di frequenza, notifiche di permanenza, backend e AI reale.</tspan></text><text x="48" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="48" dy="0">Fonte: blueprint consolidato e brief dell’autore, 11 ottobre 2026. La struttura resta verificabile e modificabile.</tspan></text></svg>
