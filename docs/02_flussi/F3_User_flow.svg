<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1282" viewBox="0 0 1280 1282" role="img"><title>F3 Raccontare una visita con AI facoltativa</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="1280" height="1282" rx="0" fill="#fff" stroke="#fff"/><text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202020"><tspan x="40" dy="0">F3 · Raccontare una visita con AI facoltativa</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#202020"><tspan x="40" dy="0">Percorso atteso H · frecce piene: progressione · tratteggiate: recupero/ritorno</tspan></text><text x="40" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="40" dy="0">Inizio: Visita dichiarata o bozza da riprendere</tspan></text><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="40" dy="0">Percorso principale</tspan></text><text x="805" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="805" dy="0">Rami e ritorni espliciti</tspan></text><g id="F3-1" aria-label="1. Dichiara visita e rispondi"><rect x="40" y="198" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">1. Dichiara visita e rispondi</tspan></text><text x="52" y="252.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S05 / S20 → S15</tspan><tspan x="52" dy="22.4">Data/fascia; condizioni e giudizio distinti; non so/non applicabile.</tspan></text></g><line x1="390" y1="328" x2="390" y2="357" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F3-2" aria-label="2. Scrivi appunti o testo"><rect x="40" y="360" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">2. Scrivi appunti o testo</tspan></text><text x="52" y="414.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S16</tspan><tspan x="52" dy="22.4">Percorso manuale completo; bozza conservata.</tspan></text></g><line x1="390" y1="490" x2="390" y2="519" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F3-3" aria-label="3. Invoca AI se desiderato"><rect x="40" y="522" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="545" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">3. Invoca AI se desiderato</tspan></text><text x="52" y="576.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S16 / S16-A</tspan><tspan x="52" dy="22.4">Senza AI: S16 → S17. Con AI: originale e proposta separati.</tspan></text></g><line x1="390" y1="652" x2="390" y2="681" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F3-4" aria-label="4. Controlla prima/dopo"><rect x="40" y="684" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="707" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">4. Controlla prima/dopo</tspan></text><text x="52" y="738.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S16-A</tspan><tspan x="52" dy="22.4">Modifica, rifiuta o applica. Applicazione non è invio.</tspan></text></g><line x1="390" y1="814" x2="390" y2="843" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F3-5" aria-label="5. Anteprima e destinatari"><rect x="40" y="846" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="869" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">5. Anteprima e destinatari</tspan></text><text x="52" y="900.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S17</tspan><tspan x="52" dy="22.4">Pubblico o gruppo scelto; identità mostrata; modifica/ritorno.</tspan></text></g><line x1="390" y1="976" x2="390" y2="1005" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F3-6" aria-label="6. Invia esplicitamente"><rect x="40" y="1008" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">6. Invia esplicitamente</tspan></text><text x="52" y="1062.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S17 → S18</tspan><tspan x="52" dy="22.4">Esito dimostrativo; nessuna pubblicazione automatica dell’AI.</tspan></text></g><g id="" aria-label="Non applicabile / uscita"><rect x="805" y="198" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="221" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Non applicabile / uscita</tspan></text><text x="817" y="250.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S15 → risposta non applicabile oppure salva bozza</tspan><tspan x="817" dy="19.599999999999998">S20</tspan></text></g><line x1="740" y1="263" x2="801" y2="263" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="328" x2="1022" y2="343" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="343" x2="740" y2="343" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Percorso senza AI"><rect x="805" y="360" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Percorso senza AI</tspan></text><text x="817" y="412.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S16 → S17: vai direttamente all’anteprima con il</tspan><tspan x="817" dy="19.599999999999998">testo dell’autore</tspan></text></g><line x1="740" y1="425" x2="801" y2="425" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M805,474 L777,474 L777,951 L741,951" fill="none" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="AI errata o indisponibile"><rect x="805" y="522" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">AI errata o indisponibile</tspan></text><text x="817" y="574.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S16-A rifiuta/modifica → S16 manuale; appunti</tspan><tspan x="817" dy="19.599999999999998">preservati</tspan></text></g><line x1="740" y1="587" x2="801" y2="587" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="652" x2="1022" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="667" x2="740" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Cambio visibilità / ripensamento"><rect x="805" y="846" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="869" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Cambio visibilità / ripensamento</tspan></text><text x="817" y="898.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S17 → modifica o torna a S16; bozza conservata</tspan></text></g><line x1="740" y1="911" x2="801" y2="911" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="976" x2="1022" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="991" x2="740" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Invio fallito"><rect x="805" y="1008" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Invio fallito</tspan></text><text x="817" y="1060.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S18-R → controlla stato → retry singolo oppure</tspan><tspan x="817" dy="19.599999999999998">salva bozza S20</tspan></text></g><line x1="740" y1="1073" x2="801" y2="1073" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="1138" x2="1022" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="1153" x2="740" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="40" y="1227" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020"><tspan x="40" dy="0">Fine: Contributo inviato con destinatari scelti oppure bozza conservata</tspan></text><text x="40" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="40" dy="0">Fonte: brief e blueprint, 11 ottobre 2026. Trasporti, veridicità reale e coordinamento multiutente restano fuori dalla simulazione.</tspan></text></svg>
