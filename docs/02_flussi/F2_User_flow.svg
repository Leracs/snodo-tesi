<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1444" viewBox="0 0 1280 1444" role="img"><title>F2 Proporre e scegliere con amici</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="1280" height="1444" rx="0" fill="#fff" stroke="#fff"/><text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202020"><tspan x="40" dy="0">F2 · Proporre e scegliere con amici</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#202020"><tspan x="40" dy="0">Percorso atteso H · frecce piene: progressione · tratteggiate: recupero/ritorno</tspan></text><text x="40" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="40" dy="0">Inizio: Occasione condivisa con persone note</tspan></text><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="40" dy="0">Percorso principale</tspan></text><text x="805" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="805" dy="0">Rami e ritorni espliciti</tspan></text><g id="F2-1" aria-label="1. Definisci proposta e città"><rect x="40" y="198" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">1. Definisci proposta e città</tspan></text><text x="52" y="252.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S11 / S12</tspan><tspan x="52" dy="22.4">Occasione, data/fascia, area condivisa; luogo iniziale facoltativo.</tspan></text></g><line x1="390" y1="328" x2="390" y2="357" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-2" aria-label="2. Invita e distingui adesioni"><rect x="40" y="360" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">2. Invita e distingui adesioni</tspan></text><text x="52" y="414.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S12 / S12-I</tspan><tspan x="52" dy="22.4">Invio invito distinto da accettazione/rifiuto del partecipante.</tspan></text></g><line x1="390" y1="490" x2="390" y2="519" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-3" aria-label="3. Condividi criteri volontari"><rect x="40" y="522" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="545" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">3. Condividi criteri volontari</tspan></text><text x="52" y="576.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S13</tspan><tspan x="52" dy="22.4">Vincoli e preferenze espliciti; motivazioni personali non richieste.</tspan></text></g><line x1="390" y1="652" x2="390" y2="681" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-4" aria-label="4. Confronta alternative"><rect x="40" y="684" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="707" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">4. Confronta alternative</tspan></text><text x="52" y="738.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S13 / S05</tspan><tspan x="52" dy="22.4">AI quando chiamata; stessi luoghi e fonti; compromessi dichiarati.</tspan></text></g><line x1="390" y1="814" x2="390" y2="843" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-5" aria-label="5. Esprimi preferenza, poi conferma"><rect x="40" y="846" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="869" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">5. Esprimi preferenza, poi conferma</tspan></text><text x="52" y="900.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S13 / S13-C</tspan><tspan x="52" dy="22.4">Preferenza per card separata da Accetto/Non va bene/Da valutare.</tspan></text></g><line x1="390" y1="976" x2="390" y2="1005" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-6" aria-label="6. Leggi esito umano"><rect x="40" y="1008" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">6. Leggi esito umano</tspan></text><text x="52" y="1062.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S14 / S14-W</tspan><tspan x="52" dy="22.4">H: aderenti confermati e nessun invito pendente per l’accordo completo.</tspan></text></g><line x1="390" y1="1138" x2="390" y2="1167" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F2-7" aria-label="7. Apri scheda e navigatore"><rect x="40" y="1170" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="1193" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">7. Apri scheda e navigatore</tspan></text><text x="52" y="1224.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S05 / S21</tspan><tspan x="52" dy="22.4">Ogni persona verifica il proprio tragitto esternamente.</tspan></text></g><g id="" aria-label="Invito rifiutato o scaduto"><rect x="805" y="360" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Invito rifiutato o scaduto</tspan></text><text x="817" y="412.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S12-I: stato distinto, correggi invito o prosegui</tspan><tspan x="817" dy="19.599999999999998">con aderenti</tspan></text></g><line x1="740" y1="425" x2="801" y2="425" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="490" x2="1022" y2="505" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="505" x2="740" y2="505" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Vincoli incompatibili"><rect x="805" y="522" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Vincoli incompatibili</tspan></text><text x="817" y="574.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S13-R → chiedi quale vincolo modificare</tspan><tspan x="817" dy="19.599999999999998">volontariamente; no cambi taciti</tspan></text></g><line x1="740" y1="587" x2="801" y2="587" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="652" x2="1022" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="667" x2="740" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Risposta o invito in attesa"><rect x="805" y="846" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="869" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Risposta o invito in attesa</tspan></text><text x="817" y="898.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S13-C → S14-W: esito provvisorio; nessun voto</tspan><tspan x="817" dy="19.599999999999998">implicito; Maps resta accessibile</tspan></text></g><line x1="740" y1="911" x2="801" y2="911" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="976" x2="1022" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="991" x2="740" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Cambia luogo/città/vincolo"><rect x="805" y="1008" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Cambia luogo/città/vincolo</tspan></text><text x="817" y="1060.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S14 → riapri S13; conferme precedenti da</tspan><tspan x="817" dy="19.599999999999998">riconfermare</tspan></text></g><line x1="740" y1="1073" x2="801" y2="1073" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="1138" x2="1022" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="1153" x2="740" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="40" y="1389" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020"><tspan x="40" dy="0">Fine: Esito concordato oppure attesa/decisione aperta leggibile</tspan></text><text x="40" y="1419" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="40" dy="0">Fonte: brief e blueprint, 11 ottobre 2026. Trasporti, veridicità reale e coordinamento multiutente restano fuori dalla simulazione.</tspan></text></svg>
