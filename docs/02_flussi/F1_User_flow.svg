<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1282" viewBox="0 0 1280 1282" role="img"><title>F1 Scegliere un luogo individualmente</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4b4b4b"/></marker></defs><rect x="0" y="0" width="1280" height="1282" rx="0" fill="#fff" stroke="#fff"/><text x="40" y="56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202020"><tspan x="40" dy="0">F1 · Scegliere un luogo individualmente</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#202020"><tspan x="40" dy="0">Percorso atteso H · frecce piene: progressione · tratteggiate: recupero/ritorno</tspan></text><text x="40" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="40" dy="0">Inizio: Bisogno/occasione e criteri da esplicitare</tspan></text><text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="40" dy="0">Percorso principale</tspan></text><text x="805" y="176" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#202020"><tspan x="805" dy="0">Rami e ritorni espliciti</tspan></text><g id="F1-1" aria-label="1. Scegli città/zona italiana"><rect x="40" y="198" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="221" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">1. Scegli città/zona italiana</tspan></text><text x="52" y="252.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S01</tspan><tspan x="52" dy="22.4">Scelta manuale o posizione autorizzata; origine distanza visibile.</tspan></text></g><line x1="390" y1="328" x2="390" y2="357" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F1-2" aria-label="2. Cerca per criteri o usa AI"><rect x="40" y="360" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">2. Cerca per criteri o usa AI</tspan></text><text x="52" y="414.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S02 / S03 / S04 / S10</tspan><tspan x="52" dy="22.4">AI facoltativa; città ambigua chiarita prima della ricerca.</tspan></text></g><line x1="390" y1="490" x2="390" y2="519" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F1-3" aria-label="3. Confronta lista o mappa"><rect x="40" y="522" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="545" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">3. Confronta lista o mappa</tspan></text><text x="52" y="576.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S03 / S02</tspan><tspan x="52" dy="22.4">Area, criteri e riferimento delle distanze restano riconoscibili.</tspan></text></g><line x1="390" y1="652" x2="390" y2="681" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F1-4" aria-label="4. Apri la stessa scheda luogo"><rect x="40" y="684" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="707" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">4. Apri la stessa scheda luogo</tspan></text><text x="52" y="738.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S05</tspan><tspan x="52" dy="22.4">Praticità, fonti, atmosfera, media e contributi.</tspan></text></g><line x1="390" y1="814" x2="390" y2="843" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F1-5" aria-label="5. Approfondisci dato decisivo"><rect x="40" y="846" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="869" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">5. Approfondisci dato decisivo</tspan></text><text x="52" y="900.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S06–S09</tspan><tspan x="52" dy="22.4">Distinzione dichiarazione/contributo/riepilogo; assenza non è garanzia.</tspan></text></g><line x1="390" y1="976" x2="390" y2="1005" stroke="#4b4b4b" stroke-width="1.7" marker-end="url(#arrow)"/><g id="F1-6" aria-label="6. Scegli, salva o avvia Maps"><rect x="40" y="1008" width="700" height="130" rx="8" fill="#f6f6f6" stroke="#9a9a9a"/><text x="52" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#202020"><tspan x="52" dy="0">6. Scegli, salva o avvia Maps</tspan></text><text x="52" y="1062.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#202020"><tspan x="52" dy="0">S05 / S19 / S21</tspan><tspan x="52" dy="22.4">Conserva contesto; il tragitto è verificato nel servizio esterno.</tspan></text></g><g id="" aria-label="Posizione negata"><rect x="805" y="198" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="221" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Posizione negata</tspan></text><text x="817" y="250.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S01-R → città manuale → S02</tspan></text></g><line x1="740" y1="263" x2="801" y2="263" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="328" x2="1022" y2="343" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="343" x2="740" y2="343" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Città ambigua o AI indisponibile"><rect x="805" y="360" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="383" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Città ambigua o AI indisponibile</tspan></text><text x="817" y="412.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S10-C chiarisce; S10-U → ricerca ordinaria S03</tspan></text></g><line x1="740" y1="425" x2="801" y2="425" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="490" x2="1022" y2="505" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="505" x2="740" y2="505" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Nessun risultato"><rect x="805" y="522" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Nessun risultato</tspan></text><text x="817" y="574.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S03-R → modifica esplicita S04 → S03; nessun</tspan><tspan x="817" dy="19.599999999999998">vincolo allentato da sola AI</tspan></text></g><line x1="740" y1="587" x2="801" y2="587" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="652" x2="1022" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="667" x2="740" y2="667" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Dato insufficiente/discordante"><rect x="805" y="846" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="869" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Dato insufficiente/discordante</tspan></text><text x="817" y="898.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S09 → fonti/limite → S05; torna a criteri se</tspan><tspan x="817" dy="19.599999999999998">decisivo</tspan></text></g><line x1="740" y1="911" x2="801" y2="911" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="976" x2="1022" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="991" x2="740" y2="991" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><g id="" aria-label="Maps non disponibile"><rect x="805" y="1008" width="435" height="130" rx="8" fill="#fff" stroke="#9a9a9a"/><text x="817" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#202020"><tspan x="817" dy="0">Maps non disponibile</tspan></text><text x="817" y="1060.95" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#202020"><tspan x="817" dy="0">S21 → annulla o servizio alternativo; ritorno alla</tspan><tspan x="817" dy="19.599999999999998">stessa scheda</tspan></text></g><line x1="740" y1="1073" x2="801" y2="1073" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="1022" y1="1138" x2="1022" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4"/><line x1="1022" y1="1153" x2="740" y2="1153" stroke="#4b4b4b" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="40" y="1227" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#202020"><tspan x="40" dy="0">Fine: Luogo scelto e salvato oppure passaggio consapevole a Maps</tspan></text><text x="40" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#202020"><tspan x="40" dy="0">Fonte: brief e blueprint, 11 ottobre 2026. Trasporti, veridicità reale e coordinamento multiutente restano fuori dalla simulazione.</tspan></text></svg>
